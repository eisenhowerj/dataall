[project]
name = "dataall"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "ariadne==0.26.2",
    "aws-xray-sdk==2.15.0",
    "boto3==1.42.8",
    "fastapi==0.124.2",
    "nanoid==2.0.0",
    "opensearch-py==3.1.0",
    "PyAthena==3.22.0",
    "psycopg2-binary>=2.9.9",
    "pyjwt==2.12.0",
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "requests-aws4auth==1.3.1",
    "sqlalchemy==2.0.45",
    "alembic==1.17.2",
    "retrying==1.4.2",
    "langchain-aws==1.1.0",
    "langchain-core==1.2.11",
    "pydantic==2.12.5",
]

[dependency-groups]
deploy = [
    "aws-cdk-lib==2.232.1",
    "boto3==1.42.8",
    "boto3-stubs==1.42.8",
    "cdk-nag==2.7.2",
    "cdk-klayers==0.3.0",
]
cdkproxy = [
    { include-group = "deploy" },
    "tabulate==0.9.0",
    "uvicorn==0.38.0",
    "werkzeug==3.1.6",
    "git-remote-codecommit==1.17",
    "aws-ddk-core==1.4.1",
]
test = [
    "setuptools==82.0.0",
    "munch==4.0.0",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-dependency==0.6.0",
    "httpx==0.27.2",
    "werkzeug==3.1.6",
    "assertpy==1.1.0",
]
integration = [
    "assertpy==1.1.0",
    "boto3==1.42.8",
    "munch==4.0.0",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-dependency==0.6.0",
    "requests==2.32.5",
    "dataclasses-json==0.6.7",
    "werkzeug==3.1.6",
    "retrying==1.4.2",
    "requests-oauthlib==2.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "deploy" },
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
src = ["backend", "deploy"]
target-version = "py39"

[tool.ruff.lint]
exclude = [ "tests/**", "**/input_types.py", "**/mutations.py", "**/queries.py", "**/types.py", "**/api/__init__.py"]
#select = ["D", "E", "F", "I", "PL", "RUF100", "W", "FA", "UP", "PYI036"]
ignore=[
    "E501",
    "F841",
    "F403",
    "F401",
    "E712",
    "E203",
    "E741"
]


[tool.ruff.lint.pylint]
max-args = 25  # Maximum number of arguments for function / method.
max-bool-expr = 5  # Maximum number of boolean expressions in an if statement (see R0916).
max-branches = 15  # Maximum number of branch for function / method body.
max-locals = 30  # Maximum number of locals for function / method body.
max-public-methods = 20  # Maximum number of public methods for a class (see R0904).
max-returns = 6  # Maximum number of return / yield for function / method body.
max-statements = 50  # Maximum number of statements in function / method body.

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
