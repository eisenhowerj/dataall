name: checkov

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    - v2m*

permissions:
  contents: read

jobs:
  build:
    env:
      CDK_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      CDK_DEFAULT_ACCOUNT: 111111111111
      GITHUB_ACTIONS: true
      CHECKOV_ACTIONS: true
      DATAALL_REPO_BRANCH: main
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: dataall
          POSTGRES_PASSWORD: docker
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
      - name: Install CDK
        run: |
          npm install -g aws-cdk cdk-nag
          cdk --version
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Requirements
        run: uv sync --group deploy
      - name: CDK Synth
        run: |
          npx cdk synth
      - name: Resources CDK Synth
        run: make checkov-synth
      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12.2845.0
        with:
          directory: .
          quiet: true
          skip_path: tests/, .github, compose/, docker/dev/
          hard_fail_on: MEDIUM
          soft_fail_on: LOW
          baseline: .checkov.baseline
