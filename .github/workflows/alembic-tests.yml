name: alembic migration tests
on:
  workflow_dispatch:
  pull_request:
    branches:
    - main
    - release/*
    - main-v2
    - v2m*

env:
  envname: local

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: dataall
          POSTGRES_PASSWORD: docker
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Drop tables
        run: make drop-tables
      - name: Show history
        run: make history-db
      - name: Upgrade tables
        run: make upgrade-db
